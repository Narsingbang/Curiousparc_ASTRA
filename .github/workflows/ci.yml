name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for Leaked Secrets
        run: npm run check:secrets

      - name: Typecheck Workspaces
        run: npm run typecheck

      - name: Lint Codebase
        run: npm run lint

      - name: Run Test Suite
        run: npm test
